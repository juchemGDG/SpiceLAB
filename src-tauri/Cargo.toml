[package]
name = "spicelab"
version = "0.1.0"
description = "SpiceLab – Schaltungssimulation für den Unterricht"
authors = ["juchemGDG"]
license = "MIT"
edition = "2021"

[lib]
name = "spicelab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
